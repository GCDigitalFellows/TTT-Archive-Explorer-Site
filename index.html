<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tagging The Tower Archive Explorer</title>
  </head>
  <body>
    <main>
      <h1>Tagging The Tower Archive Explorer</h1>
      <p><a href="reviews/accessibility_redesign_2026-11-10/prototype/index.html">Open the archive homepage</a></p>
      <p><a href="explorer.html#view=browse">Browse the complete archive</a></p>
    </main>
    <script>
      // Preserve bookmarks into the full explorer, including old skip links.
      const legacyRoute = /(?:^#|[&?])view=|^#wp-/.test(location.hash);
      const destination = legacyRoute
        ? "explorer.html"
        : "reviews/accessibility_redesign_2026-11-10/prototype/index.html";
      location.replace(destination + location.search + location.hash);
    </script>
  </body>
</html>
